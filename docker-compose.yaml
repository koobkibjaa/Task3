# Airflow สำหรับรันบนเครื่องตัวเอง (container เดียว: `airflow standalone`)
# รัน:   docker compose up -d       แล้วเปิด http://localhost:8080
# หยุด:  docker compose down        (ประวัติการรันใน Airflow หาย แต่ไฟล์ข้อมูลในโฟลเดอร์โปรเจกต์ยังอยู่)
services:
  airflow:
    image: apache/airflow:3.3.2
    command: standalone
    ports:
      - "8080:8080"
    environment:
      # เวลาใน container = เวลาไทย (โค้ดใช้ datetime.now() ตั้งชื่อไฟล์และตัดสิน today/yesterday)
      TZ: Asia/Bangkok
      AIRFLOW__CORE__DEFAULT_TIMEZONE: Asia/Bangkok
      # ให้ DAG import แพ็กเกจ thaiwater/ และ tmd/ ได้
      PYTHONPATH: /opt/airflow/project
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      # ใช้บนเครื่องตัวเองเท่านั้น: เข้า UI ได้เลยไม่ต้อง login
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"
      # tmd/api.py ใช้ truststore (ไม่มีใน image) -- วิธีนี้เหมาะกับทดลองเท่านั้น
      _PIP_ADDITIONAL_REQUIREMENTS: truststore
    volumes:
      - ./dags:/opt/airflow/dags
      # โค้ด + ไฟล์ผลลัพธ์ (thaiwater_daily/, tmd_today/, data/ ...) เขียนลงโฟลเดอร์นี้บน Windows โดยตรง
      - .:/opt/airflow/project
